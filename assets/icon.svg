<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Parcel Permit Scout: a surveyed lot (corner pins, boundary) under a magnifying glass. Drawn for this project, 17 Nov 2026. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0e4f56"/>
  <!-- the lot: an irregular four-sided parcel -->
  <path d="M22 34 L78 24 L92 76 L30 88 Z" fill="#1f7a82" stroke="#eaf6f6" stroke-width="6" stroke-linejoin="round"/>
  <!-- corner pins -->
  <circle cx="22" cy="34" r="6" fill="#eaf6f6"/>
  <circle cx="78" cy="24" r="6" fill="#eaf6f6"/>
  <circle cx="30" cy="88" r="6" fill="#eaf6f6"/>
  <!-- magnifying glass over the lot's far corner -->
  <line x1="98" y1="98" x2="114" y2="114" stroke="#f4b740" stroke-width="12" stroke-linecap="round"/>
  <circle cx="84" cy="82" r="21" fill="#0e4f56" fill-opacity="0.55" stroke="#f4b740" stroke-width="9"/>
</svg>
